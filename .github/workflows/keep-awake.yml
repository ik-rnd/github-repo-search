name: Keep Render Backend Awake

on:
  schedule:
    # Run every 10 minutes to prevent Render free tier from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: |
          # Replace this URL with your exact Render backend URL if it is different
          curl -s https://github-repo-search-backend.onrender.com/api/ping/
